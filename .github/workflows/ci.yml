name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.version }} version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [mac, windows]
    defaults:
      run:
        working-directory: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.version }}/requirements*.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Safety + logic tests
        run: pytest -q
      - name: 90-day backtest on generated data
        run: |
          python run.py --backtest 90 --quiet | tee backtest.txt
          echo "### ${{ matrix.version }} version" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat backtest.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
